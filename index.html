      const [selectedJob, setSelectedJob] = useState(null);
      const [modalTab, setModalTab] = useState("details");
      const [modalLoading, setModalLoading] = useState(false);
      const [roadmapData, setRoadmapData] = useState("");
      const [roadmapLoading, setRoadmapLoading] = useState(false);
      const [skillGapInput, setSkillGapInput] = useState("");
      const [skillGapData, setSkillGapData] = useState("");
      const [skillGapLoading, setSkillGapLoading] = useState(false);
      const [activeTooltip, setActiveTooltip] = useState(null);
      
      const toggleTooltip = (name) => setActiveTooltip(prev => prev === name ? null : name);

      const showToast = (message, type = 'info') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000);
      };

      const isJobSaved = (jobId) => savedJobs.some(sj => sj.id === jobId);

      const toggleSaveJob = (job) => {
        setSavedJobs(prev => {
          const exists = prev.some(sj => sj.id === job.id);
          const next = exists ? prev.filter(sj => sj.id !== job.id) : [...prev, { ...job }];
          localStorage.setItem('fjp_savedJobs', JSON.stringify(next));
          return next;
        });
      };

      const clearAllSaved = () => {
        setSavedJobs([]);
        localStorage.setItem('fjp_savedJobs', JSON.stringify([]));
        setShowCompare(false);
        showToast('All saved jobs cleared.', 'info');
      };

      const saveData = async (newJobs) => {
        const data = { jobs: newJobs, updatedAt: new Date().toISOString() };
        localStorage.setItem('fjp_globalState', JSON.stringify(data));
        setLastSyncDate(new Date(data.updatedAt).toLocaleString());
        if (fb.ready) {
          try { await fb.setDoc(fb.doc('market_trends/global'), data); } catch(e) { console.warn('Firestore write failed:', e); }
        }
      };

      const applySorts = (jobList) => {
        let sorted = [...jobList];
        const sortFns = {
          "Highest Salary": (a,b) => parseSalary(b.salary) - parseSalary(a.salary),
          "Highest Demand": (a,b) => (b.demandScore||0) - (a.demandScore||0),
          "Best Work From Home": (a,b) => (b.wfhScore||0) - (a.wfhScore||0),
          "Most Future-Proof": (a,b) => (b.futureProof||0) - (a.futureProof||0),
          "Easiest to Enter": (a,b) => (a.entryDifficulty||0) - (b.entryDifficulty||0),
          "Most Hired Recently": (a,b) => (b.hiredLastWeek||0) - (a.hiredLastWeek||0),
        };
        [mbSort3, mbSort2, mbSort1].forEach(s => { if (s !== "None" && sortFns[s]) sorted.sort(sortFns[s]); });
        return sorted;
      };

      // Firebase snapshot listener
      useEffect(() => {
        if (!fb.ready) return;
        try {
          const unsub = fb.onSnapshot(fb.doc('market_trends/global'), (snap) => {
            if (snap.exists()) {
              const data = snap.data();
              if (data.jobs && data.jobs.length > 0) {
                setJobs(data.jobs);
                setLastSyncDate(data.updatedAt ? new Date(data.updatedAt).toLocaleString() : "Never");
                setLoading(false);
              }
            }
          });
          return unsub;
        } catch(e) { console.warn('Firestore listener failed:', e); }
      }, []);

      // Init data
      useEffect(() => {
        const saved = localStorage.getItem('fjp_savedJobs');
        if (saved) { try { setSavedJobs(JSON.parse(saved)); } catch(e) {} }

        const initData = async () => {
          try {
            const stored = localStorage.getItem('fjp_globalState');
            if (stored) {
              const data = JSON.parse(stored);
              if (data.updatedAt) setLastSyncDate(new Date(data.updatedAt).toLocaleString());
              setJobs(data.jobs || SEED_JOBS);
              setLoading(false);
              
              const alreadyRefreshedThisSession = sessionStorage.getItem('fjp_refreshed');
              const lastUp = data.updatedAt ? new Date(data.updatedAt) : new Date(0);
              const todayGMT = new Date(); todayGMT.setUTCHours(0,0,0,0);
              if (!alreadyRefreshedThisSession && lastUp < todayGMT) {
                sessionStorage.setItem('fjp_refreshed', '1');
                showToast("Refreshing daily metrics...", "info");
                triggerDailyRefresh(data.jobs || SEED_JOBS);
              }
            } else {
              setJobs(SEED_JOBS);
              await saveData(SEED_JOBS);
              setLoading(false);
              showToast("Loaded 50 seeded future-proof jobs.", "success");
            }
          } catch(e) {
            console.error('Init error:', e);
            setJobs(SEED_JOBS);
            setLoading(false);
          }
        };
        setTimeout(() => { if (jobs.length === 0) initData(); }, fb.ready ? 2000 : 0);
      }, []);

      const triggerDailyRefresh = async (currentJobs) => {
        try {
          const titles = currentJobs.slice(0,20).map(j=>j.title).join(", ");
          const result = await fetchWithRetry(() => jsonModel.generateContent(PROMPTS.DAILY_METRICS(titles)));
          const updates = JSON.parse(result.response.text());
          const updated = currentJobs.map(job => {
            const u = updates.find(x => x.title === job.title);
            return u ? { ...job, demandScore: u.demandScore, hiredLastWeek: u.hiredLastWeek } : job;
          });
          await saveData(updated);
          setJobs(updated);
          showToast("Daily metrics updated!", "success");
        } catch(e) {
          console.error(e);
          showToast('Failed to refresh metrics.', 'error');
          setJobs(currentJobs);
        } finally { setLoading(false); }
      };

      const generateMarketBuilder = async () => {
        setMbLoading(true); setLoading(true);
        const priorities = [mbSort1, mbSort2, mbSort3];
        try {
          const result = await fetchWithRetry(() => jsonModel.generateContent(PROMPTS.MARKET_BUILDER(mbCategory, priorities)));
          let newJobs = JSON.parse(result.response.text());
          newJobs = applySorts(newJobs);
          await saveData(newJobs);
          setJobs(newJobs);
          showToast(`Market optimized for: ${mbCategory}`, "success");
        } catch(e) {
          console.error(e);
          showToast('Failed to generate market.', 'error');
        } finally { setMbLoading(false); setLoading(false); }
      };

      const handleDeepSearch = async () => {
        if (!deepSearchQuery) return;
        setDeepSearchLoading(true);
        try {
          const result = await fetchWithRetry(() => jsonModel.generateContent(PROMPTS.DEEP_SEARCH(deepSearchQuery)));
          const jobObj = JSON.parse(result.response.text());
          handleOpenModal(jobObj, true);
          showToast("AI Profile generated!", "success");
        } catch(e) { console.error(e); showToast('Deep Search failed.', 'error'); }
        finally { setDeepSearchLoading(false); }
      };

      const handleOpenModal = async (job, isDeepSearch = false) => {
        setSelectedJob(job); setModalTab("details"); setRoadmapData(""); setSkillGapData(""); setSkillGapInput("");
        if (!isDeepSearch && (!job.description || !job.specification)) {
          setModalLoading(true);
          try {
            const result = await fetchWithRetry(() => jsonModel.generateContent(PROMPTS.DETAILS(job.title)));
            const details = JSON.parse(result.response.text());
            const updated = { ...job, description: details.description, specification: details.specification };
            setSelectedJob(updated);
            const nj = jobs.map(j => j.id === job.id ? updated : j);
            setJobs(nj); await saveData(nj);
          } catch(e) { console.error(e); showToast("Failed to load details.", "error"); }
          finally { setModalLoading(false); }
        }
      };

      const generateRoadmap = async () => {
        if (roadmapData || !selectedJob) return;
        setRoadmapLoading(true);
        try {
          const result = await fetchWithRetry(() => textModel.generateContent(PROMPTS.ROADMAP(selectedJob.title)));
          setRoadmapData(result.response.text());
        } catch(e) { console.error(e); showToast('Failed to generate roadmap.', 'error'); }
        finally { setRoadmapLoading(false); }
      };

      const generateSkillGap = async () => {
        if (!skillGapInput) { showToast("Enter your background first.", "error"); return; }
        setSkillGapLoading(true);
        try {
          const result = await fetchWithRetry(() => textModel.generateContent(PROMPTS.SKILL_GAP(selectedJob.title, selectedJob.skills||[], skillGapInput)));
          setSkillGapData(result.response.text());
        } catch(e) { console.error(e); showToast('Skill gap analysis failed.', 'error'); }
        finally { setSkillGapLoading(false); }
      };

      const handleRefreshTrends = () => {
        if (jobs.length === 0) { showToast("No jobs loaded. Generate a market first.", "error"); return; }
        setLoading(true);
        triggerDailyRefresh(jobs);
      };

      const filteredJobs = useMemo(() => {
        const filtered = jobs.filter(j => j.title?.toLowerCase().includes(filterQuery.toLowerCase()));
        return applySorts(filtered);
      }, [jobs, filterQuery, mbSort1, mbSort2, mbSort3]);

      const ProgressBar = ({ value, max = 100, color = "bg-indigo-500/100" }) => (
        <div className="w-full bg-white/10 rounded-full h-2 overflow-hidden">
          <div className={`h-2 rounded-full ${color} transition-all duration-700 ease-out`} style={{ width: `${Math.min((value/max)*100,100)}%` }}></div>
        </div>
      );

      return (
        <div className="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 font-sans relative">
          
          {/* Toast Notification */}
          {toast.show && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] animate-in slide-in-from-top-2 duration-300">
              <div className={`flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium backdrop-blur-xl ${toast.type==='error' ? 'bg-red-500/20 border-red-500/30 text-red-300' : toast.type==='info' ? 'bg-indigo-500/20 border-indigo-500/30 text-indigo-300' : 'bg-emerald-500/20 border-emerald-500/30 text-emerald-300'}`}>
                {toast.type === 'error' ? <AlertCircle size={16}/> : <CheckCircle size={16}/>}
                {toast.message}
              </div>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900/40 backdrop-blur-xl border-b border-white/10 px-6 py-3 shadow-[0_4px_30px_rgba(0,0,0,0.1)]">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-br from-indigo-500 to-emerald-500 p-2 rounded-lg text-white">
                  <TrendingUp size={22} strokeWidth={2.5}/>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-white">Job Pulse</h1>
                  <div className="flex items-center gap-2 text-xs text-slate-400">
                    <Clock size={11}/> <span>Auto-updated 12:00 AM GMT</span>
                    <span className="text-slate-300">|</span>
                    <span>Last Sync: {lastSyncDate}</span>
                  </div>
                </div>
              </div>
              <button onClick={handleRefreshTrends} disabled={loading}
                className="flex items-center gap-2 bg-white/5 hover:bg-white/10 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-white/10 disabled:opacity-50">
                <RefreshCw size={15} className={loading ? "animate-spin text-indigo-500" : ""}/> Refresh Trends
              </button>
            </div>
          </header>

          <main className="max-w-[1400px] mx-auto px-6 py-6 flex flex-col lg:flex-row gap-6" style={{height:'calc(100vh - 64px)'}}>
            {/* Sidebar */}
            <div className="lg:w-[320px] flex-shrink-0 space-y-5 overflow-y-auto dark-scroll" style={{maxHeight:'calc(100vh - 88px)'}}>
              {/* Market Builder */}
              <div className="glass-panel p-5">
                <h2 className="text-sm font-semibold flex items-center gap-2 mb-4 text-white uppercase tracking-wide">
                  <Filter size={15} className="text-indigo-500"/> Market Builder
                </h2>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-500 mb-1 block font-medium">Category / Industry</label>
                    <div className="relative">
                      <input type="text" value={mbCategory} onChange={(e) => setMbCategory(e.target.value)}
                        className="w-full bg-slate-900/50 border border-white/10 text-white rounded-lg px-3 py-2 pr-8 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition-all"/>
                      {mbCategory && (
                        <button onClick={() => setMbCategory('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-300">
                          <X size={14}/>
                        </button>
                      )}
                    </div>
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 mb-1 block font-medium">Priority 1 (Highest)</label>
                    <select value={mbSort1} onChange={(e) => setMbSort1(e.target.value)}
                      className="w-full bg-slate-900/50 border border-white/10 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400">
                      {SORT_OPTIONS.filter(o=>o!=='None').map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 mb-1 block font-medium">Priority 2</label>
                    <select value={mbSort2} onChange={(e) => setMbSort2(e.target.value)}
                      className="w-full bg-slate-900/50 border border-white/10 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400">
                      {SORT_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-500 mb-1 block font-medium">Priority 3</label>
                    <select value={mbSort3} onChange={(e) => setMbSort3(e.target.value)}
                      className="w-full bg-slate-900/50 border border-white/10 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400">
                      {SORT_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                  <button onClick={generateMarketBuilder} disabled={mbLoading}
                    className="btn-liquid btn-liquid-indigo w-full flex items-center justify-center gap-2 bg-indigo-600/80 hover:bg-indigo-600 text-white px-4 py-2.5 text-sm font-semibold disabled:opacity-50 mt-2">
                    {mbLoading ? <Loader2 size={15} className="animate-spin"/> : <TrendingUp size={15}/>} Generate Market
                  </button>
                </div>
              </div>

              {/* Deep Search */}
              <div className="glass-panel p-5">
                <h2 className="text-sm font-semibold flex items-center gap-2 mb-3 text-white uppercase tracking-wide">
                  <Sparkles size={15} className="text-amber-500"/> Instant Deep Search
                </h2>
                <div className="relative mb-3">
                  <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size={15}/>
                  <input type="text" placeholder="e.g. Quantum Prompt Engineer..."
                    value={deepSearchQuery} onChange={(e) => setDeepSearchQuery(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleDeepSearch()}
                    className="w-full bg-slate-900/50 border border-white/10 text-white rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition-all placeholder:text-slate-400"/>
                </div>
                <button onClick={handleDeepSearch} disabled={deepSearchLoading || !deepSearchQuery}
                  className="btn-liquid btn-liquid-amber w-full flex items-center justify-center gap-2 bg-amber-500/80 hover:bg-amber-500 text-white px-4 py-2.5 text-sm font-semibold disabled:opacity-50">
                  {deepSearchLoading ? <Loader2 size={15} className="animate-spin"/> : <Sparkles size={15}/>} Deep Search
                </button>
              </div>

              {/* Saved Jobs */}
              <div className="glass-panel p-5">
                <h2 className="text-sm font-semibold flex items-center gap-2 mb-3 text-white uppercase tracking-wide">
                  <Save size={15} className="text-emerald-500"/> Saved Jobs
                  <span className="ml-auto text-xs font-normal text-slate-400">{savedJobs.length} saved</span>
                </h2>
                {savedJobs.length === 0 ? (
                  <p className="text-xs text-slate-400 leading-relaxed">Save jobs using the bookmark icon on any card. Saved jobs persist even when you generate a new market.</p>
                ) : (
                  <>
                    <div className="space-y-1.5 mb-3 max-h-48 overflow-y-auto dark-scroll">
                      {savedJobs.map(sJob => (
                        <div key={sJob.id} onClick={() => handleOpenModal(sJob, true)} className="flex items-center justify-between text-xs bg-white/5 hover:bg-white/10 rounded-lg px-3 py-2 border border-white/5 cursor-pointer transition-colors">
                          <div className="truncate mr-2">
                            <span className="font-medium text-slate-300">{sJob.title}</span>
                            <span className="text-slate-500 ml-2">{sJob.salary ? sJob.salary.split('-')[0] : ''}</span>
                          </div>
                          <button onClick={(e) => { e.stopPropagation(); toggleSaveJob(sJob); }} className="text-red-400 hover:text-red-300 flex-shrink-0" title="Remove from saved"><X size={12}/></button>
                        </div>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => setShowCompare(!showCompare)} disabled={savedJobs.length < 2}
                        className="btn-liquid btn-liquid-violet flex-1 flex items-center justify-center gap-2 bg-violet-600/80 hover:bg-violet-600 text-white px-3 py-2.5 text-sm font-semibold disabled:opacity-40">
                        <GitCompareArrows size={14}/> {showCompare ? 'Hide' : 'Compare'}
                      </button>
                      <button onClick={clearAllSaved}
                        className="btn-liquid flex items-center justify-center gap-1.5 bg-red-500/20 hover:bg-red-500/40 text-red-300 hover:text-red-200 px-3 py-2.5 text-sm font-semibold border-red-500/20">
                        <X size={14}/> Clear All
                      </button>
                    </div>
                  </>
                )}
              </div>
            </div>

            {/* Main Content */}
            <div className="flex-1 space-y-6 min-w-0 overflow-y-auto dark-scroll" style={{maxHeight:'calc(100vh - 88px)'}}>
              <div className="glass-panel p-6 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-emerald-500 to-amber-500 opacity-50"></div>
                <h2 className="text-lg font-bold text-white mb-2 tracking-tight">About This Platform</h2>
                <p className="text-sm text-slate-400 leading-relaxed mb-6">
                  Welcome to Job Pulse. This AI-powered tool tracks the top 50 future-proof careers, adapting dynamically to global market shifts based purely on verified institutional data.
                </p>
                <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                  <div className="bg-white/5 border border-white/10 rounded-xl p-3 flex items-center gap-2.5">
                    <div className="bg-indigo-500/20 p-1.5 rounded-lg"><Info size={14} className="text-indigo-400"/></div>
                    <span className="text-xs text-slate-300"><strong className="text-white font-medium">Explore</strong> details & salaries</span>
                  </div>
                  <div className="bg-white/5 border border-white/10 rounded-xl p-3 flex items-center gap-2.5">
                    <div className="bg-emerald-500/20 p-1.5 rounded-lg"><BookOpen size={14} className="text-emerald-400"/></div>
                    <span className="text-xs text-slate-300"><strong className="text-white font-medium">Generate</strong> AI roadmaps</span>
                  </div>
                  <div className="bg-white/5 border border-white/10 rounded-xl p-3 flex items-center gap-2.5">
                    <div className="bg-amber-500/20 p-1.5 rounded-lg"><BrainCircuit size={14} className="text-amber-400"/></div>
                    <span className="text-xs text-slate-300"><strong className="text-white font-medium">Analyze</strong> skill gaps</span>
                  </div>
                  <div className="bg-white/5 border border-white/10 rounded-xl p-3 flex items-center gap-2.5">
                    <div className="bg-violet-500/20 p-1.5 rounded-lg"><Sparkles size={14} className="text-violet-400"/></div>
                    <span className="text-xs text-slate-300"><strong className="text-white font-medium">Deep Search</strong> any job</span>
                  </div>
                  <div className="bg-white/5 border border-white/10 rounded-xl p-3 flex items-center gap-2.5">
                    <div className="bg-cyan-500/20 p-1.5 rounded-lg"><GitCompareArrows size={14} className="text-cyan-400"/></div>
                    <span className="text-xs text-slate-300"><strong className="text-white font-medium">Compare</strong> jobs side by side</span>
                  </div>
                </div>
              </div>

              {/* Comparison Matrix */}
              {showCompare && savedJobs.length >= 2 && (
                <div className="bg-white/[0.03] backdrop-blur-2xl border border-violet-500/20 rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.2)] overflow-x-auto">
                  <h3 className="text-sm font-bold text-white mb-2 flex items-center gap-2">
                    <GitCompareArrows size={16} className="text-violet-500"/> Job Comparison Matrix
                    <button onClick={() => setShowCompare(false)} className="ml-auto text-slate-400 hover:text-white transition-colors"><X size={16}/></button>
                  </h3>
                  <table className="w-full text-xs border-collapse mt-4">
                    <thead>
                      <tr className="border-b border-white/10">
                        <th className="text-left py-3 px-4 text-slate-400 font-medium w-40 border-b border-white/10">Criteria</th>
                        {savedJobs.map(sJob => (
                          <th key={sJob.id} className="text-center py-3 px-4 text-white font-semibold border-b border-white/10">{sJob.title}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {[
                        { label: 'Salary', key: 'salary', render: (j) => displayVal(j.salary) },
                        { label: 'Demand Score', key: 'demandScore', render: (j) => <span className={`font-semibold ${(j.demandScore||0) >= 80 ? 'text-emerald-400' : (j.demandScore||0) >= 50 ? 'text-amber-400' : 'text-red-400'}`}>{displayVal(j.demandScore)}/100</span> },
                        { label: 'Future Proof', key: 'futureProof', render: (j) => <span className={`font-semibold ${(j.futureProof||0) >= 8 ? 'text-indigo-400' : (j.futureProof||0) >= 5 ? 'text-amber-400' : 'text-red-400'}`}>{displayVal(j.futureProof)}/10</span> },
                        { label: 'Entry Difficulty', key: 'entryDifficulty', render: (j) => <span className={`font-semibold ${(j.entryDifficulty||0) <= 4 ? 'text-emerald-400' : (j.entryDifficulty||0) <= 6 ? 'text-amber-400' : 'text-red-400'}`}>{displayVal(j.entryDifficulty)}/10</span> },
                        { label: 'Work From Home', key: 'wfh', render: (j) => <span>{displayVal(j.wfh)} ({displayVal(j.wfhScore)}/100)</span> },
                        { label: 'Degree Required', key: 'degree', render: (j) => <span className={`font-medium ${j.degree === 'No' ? 'text-emerald-400' : j.degree === 'Optional' ? 'text-amber-400' : 'text-red-400'}`}>{displayVal(j.degree)}</span> },
                        { label: 'Hired Last Week', key: 'hiredLastWeek', render: (j) => displayVal(j.hiredLastWeek) },
                        { label: 'Top Skills', key: 'skills', render: (j) => Array.isArray(j.skills) ? j.skills.slice(0,3).join(', ') : 'N/A' },
                      ].map((row, ri) => (
                        <tr key={row.key} className={ri % 2 === 0 ? "bg-white/[0.02]" : "bg-transparent"}>
                          <td className="py-3 px-4 font-medium text-slate-300 border-r border-white/5">{row.label}</td>
                          {savedJobs.map(sJob => (
                            <td key={sJob.id} className="text-center py-3 px-4 text-slate-300">{row.render(sJob)}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              {showCompare && savedJobs.length < 2 && (
                <div className="bg-violet-500/10 backdrop-blur-2xl border border-violet-500/20 rounded-2xl p-4 text-center text-sm text-violet-300">
                  Save at least 2 jobs to compare them. Use the bookmark icon on any job card.
                </div>
              )}

              {/* Filter bar */}
              <div className="relative">
                <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size={16}/>
                <input type="text" placeholder="Filter loaded jobs..." value={filterQuery} onChange={(e) => setFilterQuery(e.target.value)}
                  className="w-full bg-white/[0.03] backdrop-blur-2xl border border-white/10 shadow-[0_8px_30px_rgb(0,0,0,0.2)] rounded-2xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-400 transition-all placeholder:text-slate-500"/>
              </div>

              {loading ? (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {[1,2,3,4,5,6].map(i => <div key={i} className="animate-pulse bg-white/5 rounded-2xl h-56 border border-white/10"></div>)}
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {filteredJobs.map((job, idx) => (
                    <div key={job.id||idx} onClick={() => handleOpenModal(job)}
                      className="group glass-panel glass-panel-hover p-6 transition-all duration-300 flex flex-col h-full cursor-pointer relative overflow-hidden">

                      <div className="flex justify-between items-start mb-3">
                        <h3 className="text-base font-bold text-white group-hover:text-indigo-400 transition-colors leading-tight">
                          {displayVal(job.title)}
                        </h3>
                        <button onClick={(e) => { e.stopPropagation(); toggleSaveJob(job); }}
                          title={isJobSaved(job.id) ? "Remove from saved jobs" : "Save this job for later"}
                          className="p-1.5 hover:bg-white/20 rounded-full transition-colors relative group/bm">
                          <Save size={16} className={isJobSaved(job.id) ? "fill-emerald-500 text-emerald-500" : "text-slate-400"}/>
                          <span className="absolute -bottom-7 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] px-2 py-0.5 rounded whitespace-nowrap opacity-0 group-hover/bm:opacity-100 transition-opacity pointer-events-none">
                            {isJobSaved(job.id) ? "Saved" : "Save Job"}
                          </span>
                        </button>
                      </div>

                      <div className="flex flex-wrap gap-1.5 mb-3">
                        {Array.isArray(job.skills) && job.skills.slice(0,3).map(s => (
                          <span key={s} className="bg-indigo-500/10 text-indigo-400 text-xs px-2 py-0.5 rounded-md font-medium border border-indigo-500/20">
                            {displayVal(s).replace(/[\*#_]/g,'').trim()}
                          </span>
                        ))}
                      </div>

                      <div className="text-xs text-slate-400 mb-3 font-medium">{displayVal(job.salary)}</div>

                      <div className="mt-auto space-y-2">
                        <div className="grid grid-cols-2 gap-3 text-xs">
                          <div>
                            <span className="text-slate-400 block mb-1">Demand</span>
                            <span className="font-semibold text-emerald-400">{displayVal(job.demandScore)}/100</span>
                            <ProgressBar value={job.demandScore} max={100} color="bg-emerald-500/100"/>
                          </div>
                          <div>
                            <span className="text-slate-400 block mb-1">Future Proof</span>
                            <span className="font-semibold text-indigo-400">{displayVal(job.futureProof)}/10</span>
                            <ProgressBar value={job.futureProof} max={10} color="bg-indigo-500/100"/>
                          </div>
                        </div>
                        <div className="flex items-center justify-between pt-3 border-t border-white/5">
                          <div className="flex items-center gap-3 text-xs text-slate-400">
                            <span className="flex items-center gap-1"><Home size={12}/> Work From Home: {displayVal(job.wfh)}</span>
                            <span className="flex items-center gap-1"><Gauge size={12}/> Entry: {displayVal(job.entryDifficulty)}/10</span>
                          </div>
                        </div>
                        <div className="flex items-center gap-2 pt-2">
                          <button onClick={(e) => { e.stopPropagation(); handleOpenModal(job); setModalTab("details"); }}
                            className="flex items-center gap-1 text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors">
                            <Info size={12}/> Details
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); handleOpenModal(job); setTimeout(()=>{setModalTab("roadmap"); generateRoadmap();},100); }}
                            className="flex items-center gap-1 text-xs font-medium text-emerald-400 hover:text-emerald-300 transition-colors">
                            <BookOpen size={12}/> Roadmap
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); handleOpenModal(job); setTimeout(()=>setModalTab("skillgap"),100); }}
                            className="flex items-center gap-1 text-xs font-medium text-amber-400 hover:text-amber-300 transition-colors">
                            <BrainCircuit size={12}/> Skill Gap
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                  {filteredJobs.length === 0 && (
                    <div className="col-span-full py-16 text-center text-slate-400">
                      <Search size={40} className="mx-auto mb-3 opacity-30"/>
                      <p className="text-sm">No jobs match your filter.</p>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>

          {/* Modal */}
          {selectedJob && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-slate-950/60 backdrop-blur-sm" onClick={() => setSelectedJob(null)}></div>
              <div className="relative w-full max-w-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">

                {/* Modal Header */}
                <div className="px-6 py-4 border-b border-white/10 flex justify-between items-start bg-white/5">
                  <div>
                    <h2 className="text-xl font-bold text-white mb-1">{displayVal(selectedJob.title)}</h2>
                    <div className="flex flex-wrap gap-3 text-xs text-slate-400">
                      <span className="flex items-center gap-1"><Briefcase size={12}/> {displayVal(selectedJob.salary)}</span>
                      <span className="flex items-center gap-1"><Home size={12}/> Work From Home: {displayVal(selectedJob.wfh)}</span>
                      <span className="flex items-center gap-1 relative">
                        <GraduationCap size={12}/> Degree: {displayVal(selectedJob.degree)}
                        <button onClick={(e) => { e.stopPropagation(); toggleTooltip('degree'); }} className="ml-1 text-indigo-500 hover:text-indigo-700">
                          <HelpCircle size={13}/>
                        </button>
                        {activeTooltip === 'degree' && (
                          <div className="tooltip-box">
                            <strong className="block mb-1 text-white text-sm">Credentialism vs. Skills-Based Economy</strong>
                            <p className="mb-1"><strong className="text-indigo-300">Credentialism:</strong> Some fields (medicine, law, licensed engineering) have strict formal degree requirements as legal gatekeepers. A degree is non-negotiable.</p>
                            <p><strong className="text-emerald-300">Skills-Based:</strong> In the modern tech and creative economy, portfolios, certifications, and demonstrated skills often matter more than diplomas. Many top employers now hire based on ability, not credentials.</p>
                          </div>
                        )}
                      </span>
                    </div>
                  </div>
                  <button onClick={() => { setSelectedJob(null); setActiveTooltip(null); }} className="p-1.5 text-slate-400 hover:text-slate-200 hover:bg-white/20 rounded-full transition-colors">
                    <X size={20}/>
                  </button>
                </div>

                {/* Modal Tabs */}
                <div className="flex border-b border-white/10 bg-white/5 px-6">
                  {[{key:'details',label:'Overview',Icon:Info},{key:'roadmap',label:'AI Roadmap',Icon:BookOpen},{key:'skillgap',label:'Skill Gap',Icon:BrainCircuit}].map(tab => {
                    const TabIcon = tab.Icon;
                    return (
                    <button key={tab.key}
                      onClick={() => { setModalTab(tab.key); if(tab.key==='roadmap') generateRoadmap(); }}
                      className={`flex items-center gap-1.5 px-4 py-3 text-sm font-medium transition-colors border-b-2 ${modalTab===tab.key ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                      <TabIcon size={14}/> {tab.label}
                    </button>
                    );
                  })}
                </div>

                {/* Modal Body */}
                <div className="flex-1 overflow-y-auto p-6">

                  {modalTab === 'details' && (
                    <div className="space-y-6">
                      {modalLoading ? (
                        <div className="flex justify-center py-10"><Loader2 size={28} className="animate-spin text-indigo-500"/></div>
                      ) : (
                        <>
                          <div>
                            <h3 className="text-sm font-semibold text-white mb-2 flex items-center gap-1.5"><Info size={14} className="text-indigo-500"/> Description</h3>
                            <p className="text-sm text-slate-300 leading-relaxed bg-white/5 p-4 rounded-lg border border-white/5">{displayVal(selectedJob.description)}</p>
                          </div>
                          <div>
                            <h3 className="text-sm font-semibold text-white mb-2">Specification</h3>
                            <ul className="space-y-1.5">
                              {Array.isArray(selectedJob.specification) ? selectedJob.specification.map((spec, i) => (
                                <li key={i} className="flex items-start gap-2 text-sm text-slate-300">
                                  <CheckCircle size={14} className="mt-0.5 text-emerald-500 flex-shrink-0"/>
                                  {displayVal(spec).replace(/[\*#_]/g,'').trim()}
                                </li>
                              )) : <p className="text-sm text-slate-400">Not available.</p>}
                            </ul>
                          </div>
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div className="relative text-center p-3 bg-emerald-500/10 rounded-lg border border-emerald-500/20">
                              <p className="text-2xl font-bold text-emerald-400">{displayVal(selectedJob.demandScore)}</p>
                              <p className="text-xs text-slate-400 mt-1 flex items-center justify-center gap-1">Demand Score
                                <button onClick={(e) => { e.stopPropagation(); toggleTooltip('demand'); }} className="text-indigo-400 hover:text-indigo-400"><HelpCircle size={12}/></button>
                              </p>
                              {activeTooltip === 'demand' && <div className="tooltip-box">{getDemandExplanation(selectedJob.demandScore)}</div>}
                            </div>
                            <div className="relative text-center p-3 bg-indigo-500/10 rounded-lg border border-indigo-500/20">
                              <p className="text-2xl font-bold text-indigo-400">{displayVal(selectedJob.futureProof)}/10</p>
                              <p className="text-xs text-slate-400 mt-1 flex items-center justify-center gap-1">Future Proof
                                <button onClick={(e) => { e.stopPropagation(); toggleTooltip('futureproof'); }} className="text-indigo-400 hover:text-indigo-400"><HelpCircle size={12}/></button>
                              </p>
                              {activeTooltip === 'futureproof' && <div className="tooltip-box">{getFutureProofExplanation(selectedJob.futureProof)}</div>}
                            </div>
                            <div className="relative text-center p-3 bg-amber-500/10 rounded-lg border border-amber-500/20">
                              <p className="text-2xl font-bold text-amber-400">{displayVal(selectedJob.wfhScore)}</p>
                              <p className="text-xs text-slate-400 mt-1 flex items-center justify-center gap-1">Work From Home
                                <button onClick={(e) => { e.stopPropagation(); toggleTooltip('wfh'); }} className="text-indigo-400 hover:text-indigo-400"><HelpCircle size={12}/></button>
                              </p>
                              {activeTooltip === 'wfh' && <div className="tooltip-box">{getWfhExplanation(selectedJob.wfh, selectedJob.wfhScore)}</div>}
                            </div>
                            <div className="relative text-center p-3 bg-white/5 rounded-lg border border-white/10">
                              <p className="text-2xl font-bold text-slate-200">{displayVal(selectedJob.hiredLastWeek)}</p>
                              <p className="text-xs text-slate-400 mt-1">Hired Last Wk</p>
                            </div>
                          </div>
                          <div className="grid grid-cols-2 gap-3">
                            <div className="relative p-3 bg-white/5 rounded-lg border border-white/5">
                              <p className="text-xs text-slate-400 mb-1 flex items-center gap-1">Entry Difficulty
                                <button onClick={(e) => { e.stopPropagation(); toggleTooltip('entry'); }} className="text-indigo-400 hover:text-indigo-400"><HelpCircle size={12}/></button>
                              </p>
                              <div className="flex items-center gap-2">
                                <span className="text-sm font-semibold text-slate-200">{displayVal(selectedJob.entryDifficulty)}/10</span>
                                <ProgressBar value={selectedJob.entryDifficulty} max={10} color="bg-orange-500"/>
                              </div>
                              {activeTooltip === 'entry' && <div className="tooltip-box">{getEntryExplanation(selectedJob.entryDifficulty)}</div>}
                            </div>
                            <div className="p-3 bg-white/5 rounded-lg border border-white/5">
                              <p className="text-xs text-slate-400 mb-1">Work From Home Compatibility</p>
                              <div className="flex items-center gap-2">
                                <span className="text-sm font-semibold text-slate-200">{displayVal(selectedJob.wfhScore)}/100</span>
                                <ProgressBar value={selectedJob.wfhScore} max={100} color="bg-sky-500/100"/>
                              </div>
                            </div>
                          </div>
                        </>
                      )}
                    </div>
                  )}

                  {modalTab === 'roadmap' && (
                    <div>
                      {roadmapLoading ? (
                        <div className="flex justify-center py-10"><Loader2 size={28} className="animate-spin text-indigo-500"/></div>
                      ) : (
                        <div className="text-sm text-slate-200 whitespace-pre-wrap bg-white/5 p-5 rounded-lg border border-white/5 leading-relaxed">
                          {roadmapData || "Click the AI Roadmap tab to generate."}
                        </div>
                      )}
                    </div>
                  )}

                  {modalTab === 'skillgap' && (
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-200 mb-1.5">Paste your background/resume summary:</label>
                        <textarea rows={3} value={skillGapInput} onChange={(e) => setSkillGapInput(e.target.value)}
                          className="w-full bg-slate-900/50 border border-white/10 text-white rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition-all placeholder:text-slate-400"
                          placeholder="e.g. 3 years in JavaScript, basic Python, some data analysis..."/>
                      </div>
                      <button onClick={generateSkillGap} disabled={skillGapLoading || !skillGapInput}
                        className="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors disabled:opacity-50">
                        {skillGapLoading ? <Loader2 size={15} className="animate-spin"/> : <BrainCircuit size={15}/>} Analyze Skill Gap
                      </button>
                      {skillGapData && (
                        <div className="p-4 bg-white/5 border border-indigo-500/20 rounded-lg text-sm text-slate-200 whitespace-pre-wrap leading-relaxed">
                          {skillGapData}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-transparent border-t border-white/10 mt-12 px-6 py-8">
            <div className="max-w-[1400px] mx-auto">
              <h3 className="text-sm font-semibold text-white mb-3 flex items-center gap-1.5">
                <BarChart3 size={15} className="text-indigo-500"/> Data Sources &amp; Methodology
              </h3>
              <p className="text-xs text-slate-400 leading-relaxed mb-3">
                Career insights are synthesized from AI analysis of publicly available labor market data, industry reports, and academic research. Key sources include:
              </p>
              <div className="flex flex-wrap gap-3">
                <a href="https://www.weforum.org/publications/the-future-of-jobs-report-2025/" target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 text-xs text-indigo-400 hover:text-indigo-300 font-medium transition-colors">
                  World Economic Forum <ExternalLink size={10}/>
                </a>
                <a href="https://www.bls.gov/ooh/" target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 text-xs text-indigo-400 hover:text-indigo-300 font-medium transition-colors">
                  Bureau of Labor Statistics <ExternalLink size={10}/>
                </a>
                <a href="https://www.ilo.org/research" target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 text-xs text-indigo-400 hover:text-indigo-300 font-medium transition-colors">
                  International Labour Organization <ExternalLink size={10}/>
                </a>
                <a href="https://www.mckinsey.com/mgi/our-research" target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 text-xs text-indigo-400 hover:text-indigo-300 font-medium transition-colors">
                  McKinsey Global Institute <ExternalLink size={10}/>
                </a>
                <a href="https://hbr.org/topic/subject/technology" target="_blank" rel="noopener noreferrer"
                  className="inline-flex items-center gap-1 text-xs text-indigo-400 hover:text-indigo-300 font-medium transition-colors">
                  Harvard Business Review <ExternalLink size={10}/>
                </a>
              </div>
              <div className="mt-4 bg-indigo-500/10 border border-indigo-500/20 rounded-lg p-4 flex items-start gap-2.5">
                <Info size={16} className="text-indigo-500 flex-shrink-0 mt-0.5"/>
                <p className="text-xs text-slate-300 leading-relaxed">
                  <strong className="text-slate-100">Note on Dynamic Metrics:</strong> "Hired Last Week" and "Demand Scores" are AI-estimated metrics calculated dynamically upon generating or refreshing lists, based on trailing 7-day institutional reporting and macro hiring trends. They are approximations, not live counts.
                </p>
              </div>
              <p className="text-xs text-slate-500 mt-4">Job Pulse &copy; 2026. AI-generated insights are estimates and should be used for career exploration, not as financial advice.</p>
            </div>
          </footer>

        </div>
      );
    }

    const root = window.createRoot(document.getElementById('root'));
    root.render(React.createElement(FutureJobsPulse));
  </script>

  <script type="module">
    import React, { useState, useEffect, useRef, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as lucideReact from 'lucide-react';

    // Initialize React FIRST (critical path)
    window.fb = { ready: false };
    try {
      window.React = React;
      window.useState = useState;
      window.useEffect = useEffect;
      window.useRef = useRef;
      window.useMemo = useMemo;
      window.createRoot = createRoot;
      window.lucideReact = lucideReact;

      const jsxCode = document.getElementById('jsx-code').textContent;
      const compiled = Babel.transform(jsxCode, { presets: ['react'] }).code;
      const script = document.createElement('script');
      script.textContent = compiled;
      document.body.appendChild(script);
    } catch(err) {
      document.getElementById('error-log').style.display = 'block';
      document.getElementById('error-log').textContent = "Failed to load: " + err.message;
      console.error(err);
    }
  </script>
</body>
</html>
